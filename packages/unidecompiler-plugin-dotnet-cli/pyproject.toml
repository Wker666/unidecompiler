[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unidecompiler-plugin-dotnet-cli"
version = "0.1.2"
description = ".NET CLI assembly frontend plugin for unidecompiler"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [{ name = "Wker", email = "1670133844@qq.com" }]
requires-python = ">=3.11"
dependencies = ["unidecompiler>=0.1.2,<0.2.0", "dnfile>=0.15,<1"]

[project.urls]
Homepage = "https://github.com/Wker666/unidecompiler"
Repository = "https://github.com/Wker666/unidecompiler"
Issues = "https://github.com/Wker666/unidecompiler/issues"

[project.entry-points."unidecompiler.frontends"]
dotnet-cli = "unidecompiler_plugin_dotnet_cli.plugin:DotNetFrontendPlugin"

[tool.setuptools.packages.find]
where = ["src"]
