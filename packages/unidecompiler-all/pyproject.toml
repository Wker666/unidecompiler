[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unidecompiler-all"
version = "0.1.1"
description = "Complete unidecompiler installation with CLI, GUI, and all frontend plugins"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [{ name = "Wker", email = "1670133844@qq.com" }]
requires-python = ">=3.11"
dependencies = [
    "unidecompiler-cli>=0.1.1,<0.2.0",
    "unidecompiler-gui>=0.1.1,<0.2.0",
    "unidecompiler-gui-sdk>=0.1.0,<0.2.0",
    "unidecompiler-simulator>=0.1.1,<0.2.0",
    "unidecompiler-simulation-host-python>=0.1.1,<0.2.0",
    "unidecompiler-plugin-python-pyc>=0.1.1,<0.2.0",
    "unidecompiler-plugin-jvm-class>=0.1.1,<0.2.0",
    "unidecompiler-plugin-lua>=0.1.1,<0.2.0",
    "unidecompiler-plugin-dotnet-cli>=0.1.1,<0.2.0",
    "unidecompiler-plugin-wasm>=0.1.1,<0.2.0",
]

[project.urls]
Homepage = "https://github.com/Wker666/unidecompiler"
Repository = "https://github.com/Wker666/unidecompiler"
Issues = "https://github.com/Wker666/unidecompiler/issues"

[tool.setuptools.packages.find]
where = ["src"]
