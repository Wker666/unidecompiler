[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unidecompiler-plugin-lua"
version = "0.1.0"
description = "Lua bytecode frontend plugin for unidecompiler"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["unidecompiler>=0.1.0,<0.2.0"]

[project.entry-points."unidecompiler.frontends"]
lua = "unidecompiler_plugin_lua.plugin:LuaFrontendPlugin"

[tool.setuptools.packages.find]
where = ["src"]
