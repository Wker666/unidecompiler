[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unidecompiler-gui"
version = "0.2.3"
description = "Read-only desktop workbench for unidecompiler"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [{ name = "Wker", email = "1670133844@qq.com" }]
requires-python = ">=3.11"
dependencies = [
    "unidecompiler>=0.2.2,<0.3.0",
    "unidecompiler-export>=0.2.2,<0.3.0",
    "unidecompiler-simulator>=0.2.3,<0.3.0",
    "unidecompiler-symbolic>=0.2.3,<0.3.0",
    "unidecompiler-simulation-host-python>=0.2.2,<0.3.0",
    "unidecompiler-gui-sdk>=0.2.2,<0.3.0",
    "PySide6>=6.6",
]

[project.urls]
Homepage = "https://github.com/Wker666/unidecompiler"
Repository = "https://github.com/Wker666/unidecompiler"
Issues = "https://github.com/Wker666/unidecompiler/issues"

[project.optional-dependencies]
all-formats = [
    "unidecompiler-plugin-python-pyc>=0.2.2,<0.3.0",
    "unidecompiler-plugin-jvm-class>=0.2.2,<0.3.0",
    "unidecompiler-plugin-lua>=0.2.2,<0.3.0",
    "unidecompiler-plugin-dotnet-cli>=0.2.2,<0.3.0",
    "unidecompiler-plugin-wasm>=0.2.2,<0.3.0",
]

[project.scripts]
unidecompiler-gui = "unidecompiler_gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unidecompiler_gui = ["themes/*.qss", "assets/*.jpg"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]
