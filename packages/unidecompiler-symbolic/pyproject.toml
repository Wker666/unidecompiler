[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unidecompiler-symbolic"
version = "0.2.2"
description = "Bounded symbolic execution for unidecompiler generic IR"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [{ name = "Wker", email = "1670133844@qq.com" }]
requires-python = ">=3.11"
dependencies = [
    "unidecompiler>=0.2.2,<0.3.0",
    "unidecompiler-simulator>=0.2.2,<0.3.0",
    "z3-solver>=5.1.0",
]

[project.urls]
Homepage = "https://github.com/Wker666/unidecompiler"
Repository = "https://github.com/Wker666/unidecompiler"
Issues = "https://github.com/Wker666/unidecompiler/issues"

[tool.setuptools.packages.find]
where = ["src"]
