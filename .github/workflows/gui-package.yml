name: GUI package

on: [push, pull_request]

permissions:
  contents: read
  attestations: write
  id-token: write

jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install build PySide6 pyinstaller pytest
      - run: python -m pip install -e packages/unidecompiler -e packages/unidecompiler-gui -e packages/unidecompiler-plugin-python-pyc -e packages/unidecompiler-plugin-jvm-class -e packages/unidecompiler-plugin-lua -e packages/unidecompiler-plugin-dotnet-cli -e packages/unidecompiler-plugin-wasm
      - run: python -m pytest -q tests/test_engine.py tests/test_gui.py
      - run: python -m build packages/unidecompiler
      - run: python -m build packages/unidecompiler-gui
      - run: python -c "import unidecompiler_gui"
      - run: pyinstaller --noconfirm packages/unidecompiler-gui/unidecompiler_gui.spec
      - run: >-
          python -c "import os, subprocess, sys, time; from pathlib import Path;
          exe=Path('dist')/'unidecompiler-gui'/('unidecompiler-gui.exe' if os.name == 'nt' else 'unidecompiler-gui');
          env=os.environ | {'QT_QPA_PLATFORM': 'offscreen'}; process=subprocess.Popen([str(exe)], env=env);
          time.sleep(3); code=process.poll(); process.terminate() if code is None else None;
          process.wait(timeout=10) if code is None else None; sys.exit(0 if code is None else code)"
      - uses: actions/upload-artifact@v4
        with:
          name: unidecompiler-gui-${{ runner.os }}
          path: dist/unidecompiler-gui
          if-no-files-found: error
      - uses: actions/attest-build-provenance@v2
        if: github.event_name == 'push'
        with:
          subject-path: dist/unidecompiler-gui
